<header class="bar">
  <div class="wrap bar-row">

    <a class="brand" href="{{ '/index.html' | relative_url }}">{{ site.title }}</a>

    <nav class="nav" aria-label="Primary">
      {%- for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>
        {{- item.name -}}
        {%- if page.nav == item.key %}<span class="nav-dot" aria-hidden="true"></span>{% endif -%}
      </a>
      {%- endfor %}
    </nav>

    <div class="bar-tools">
      {%- if page.collection %}
      <button type="button" class="round toc-btn" popovertarget="contents" aria-label="Contents" title="Contents">
        {% include icon.html name="list" %}
      </button>
      {%- endif %}

      <button type="button" class="round theme-btn" data-theme-toggle aria-label="Switch colour scheme">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="7.25"/><path class="half" d="M12 4.75a7.25 7.25 0 0 1 0 14.5z"/></svg>
      </button>

      <button type="button" class="round menu-btn" popovertarget="menu" aria-label="Menu">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="line line-top" d="M5 9h14"/><path class="line line-bottom" d="M5 15h14"/></svg>
      </button>
    </div>

  </div>
</header>

<nav class="menu" id="menu" popover aria-label="Primary">
  {%- for item in site.nav %}
  <a href="{{ item.url | relative_url }}"{% if page.nav == item.key %} aria-current="page"{% endif %}>{{ item.name }}</a>
  {%- endfor %}
</nav>

{%- if page.collection %}
<div class="sheet" id="contents" popover>
  <span class="kicker">Contents</span>
  <nav class="toc" aria-label="Contents"></nav>
</div>
{%- endif %}
