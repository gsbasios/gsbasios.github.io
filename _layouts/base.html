<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
{% include head.html %}
</head>
<body>

  <a class="skip" href="#main">Skip to content</a>

  <canvas class="orb" aria-hidden="true"></canvas>
  <div class="orb-still" aria-hidden="true"></div>

  {% include header.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/orb.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {%- for script in layout.scripts %}
  <script src="{{ script | prepend: '/assets/js/' | append: '.js' | relative_url }}" defer></script>
  {%- endfor %}

</body>
</html>
